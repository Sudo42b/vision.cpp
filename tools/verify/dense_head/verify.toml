# verify.toml — mmdet head 검증 설정.
#
# 예전에는 이 값들이 전부 환경변수였다. 그러면 **재현이 안 된다** — 어떤 값으로 잰 숫자인지
# 로그에 안 남고, 다음 사람이 같은 명령을 쳐도 다른 결과가 나온다.
# 여기 적힌 값이 기본이고, 실행 시 `--set key=value` 로만 덮어쓴다(그것도 로그에 찍힌다).
#
# 상대경로는 **이 파일 위치 기준**이다.

[paths]
# mmdet 저장소. 아래에 `configs/` 와 `checkpoints/` 가 있어야 한다.
mmdet = "~/mmbuild/mmdetection"
# g2c(컴파일러) 루트. 기본값은 vision.cpp 의 부모 = 이 브랜치의 g2c.
g2c = "../../../.."
# 트래커·반지도 래퍼 config 를 안쪽 검출기로 푸는 전처리기(형제 저장소).
# 없으면 그 계열만 INIT_FAIL 로 남는다 — 없다고 전체가 멈추지는 않는다.
unwrap = "../../../../../GTX_Compiler/test_script/mmdet/mmdet_unwrap_config.py"
# 중간 산출물(.pt · 생성 .cpp · gguf · 덤프). 지워도 된다.
workdir = "/tmp/visp-verify-heads"
# head 지원 여부 조사(head_support_map.py) 전용 작업 폴더.
probe_workdir = "/tmp/visp-headmap"

[run]
# 동시 실행 계열 수. ⚠️ WSL 12GB 에서 4를 넘기면 터진다 — 계열마다 torch 를 띄운다.
workers = 3
# 검증 빌드 최적화. 수치는 libggml 이 내므로 -O1 이면 충분하고 컴파일이 빠르다.
opt = "-O1"
# 입력 정방 크기.
size = 512
# 이 아래로 가용 메모리가 떨어지면 새 계열 시작을 미룬다(MB).
min_free_mb = 2500

[tolerance]
# 판정 기준: 출력 텐서의 **상대 L1/L2 거리**. 둘 다 이하여야 PASS.
#   rel_L1 = Σ|a−b| / Σ|a|      평균적으로 얼마나 어긋났나
#   rel_L2 = ‖a−b‖ / ‖a‖        큰 오차에 더 민감
# cosine 은 쓰지 않는다 — **스케일 불변**이라 크기가 통째로 틀려도 1.0 이 나온다
# (rtmdet 실측: cos 0.999450 인데 값은 97% 틀렸다).
l1 = 0.05
l2 = 0.05
